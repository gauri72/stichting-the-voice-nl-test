<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Personal Discount Code</title></head>
<body style="font-family:Segoe UI,Arial,sans-serif;line-height:1.6;color:#1a1a2e;max-width:600px;margin:0 auto;padding:24px;">
  <h2 style="color:#0891b2;">Your Personal Discount Code</h2>
  <p>Hi {{first_name}},</p>
  <p>A personal discount code has been created for you at {{organization_name}}.</p>
  <p style="font-size:24px;font-weight:bold;color:#7c3aed;letter-spacing:2px;">{{discount_code}}</p>
  <p>Discount: <strong>{{discount_value}}</strong></p>
  <p>Valid until: {{expiry_date}}</p>
  <p>Use this code during checkout to receive your discount.</p>
</body>
</html>
