<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>{{organization_name}}</title></head>
<body style="font-family:Segoe UI,Arial,sans-serif;line-height:1.6;color:#1a1a2e;max-width:600px;margin:0 auto;padding:24px;background:#f8fafc;">
  <div style="background:linear-gradient(135deg,#002147,#008080);padding:20px;border-radius:12px 12px 0 0;">
    <p style="margin:0;color:#fff;font-size:12px;letter-spacing:1px;">STICHTING</p>
    <p style="margin:4px 0 0;color:#3ecf9a;font-weight:bold;font-size:16px;">THE V.O.I.C.E. NL</p>
  </div>
  <div style="background:#fff;padding:24px;border:1px solid #e5eeee;border-top:0;border-radius:0 0 12px 12px;">
    <h2 style="color:#0891b2;">Donation Receipt</h2><p>Hi {{first_name}},</p><p>Your donation receipt <strong>{{receipt_number}}</strong> is attached. Thank you for your generous gift of <strong>{{amount}}</strong>.</p>
    <p style="margin-top:24px;font-size:13px;color:#666;">Questions? Contact us at <a href="mailto:{{support_email}}" style="color:#0891b2;">{{support_email}}</a></p>
    <p style="font-size:12px;color:#999;"><a href="{{website_url}}" style="color:#7c3aed;">{{website_url}}</a></p>
    <p style="font-size:11px;color:#aaa;margin-top:16px;">© 2026 Stichting The V.O.I.C.E. NL. All rights reserved.</p>
  </div>
</body>
</html>
