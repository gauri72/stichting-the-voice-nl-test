<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6338c2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="V.O.I.C.E. NL" />
    <title>Stichting The V.O.I.C.E. NL</title>
    <link rel="preload" href="/favicon.png" as="image" type="image/png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function () {
        var prefKey = "voice-theme-preference";
        var legacyKey = "voice-theme";
        var pref = localStorage.getItem(prefKey);
        if (pref !== "light" && pref !== "dark") {
          var legacy = localStorage.getItem(legacyKey);
          pref = legacy === "light" || legacy === "dark" ? legacy : "dark";
        }
        document.documentElement.setAttribute("data-theme", pref === "light" ? "light" : "dark");
      })();
      document.documentElement.classList.add("splash-open");
      window.setTimeout(function () {
        document.documentElement.classList.remove("splash-open");
      }, 4000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
