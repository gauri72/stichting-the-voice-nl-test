name: i18n sync

on:
  push:
    branches: [main]
    paths:
      - "client/src/i18n/locales/en/**"
      - "client/src/components/**"
      - "server/scripts/i18n-*.js"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: i18n-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        run: npm install --workspace server --no-audit --no-fund

      - name: Check translation structure
        run: npm run i18n:check --workspace server

      - name: Fill in missing translations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run i18n:translate --workspace server

      - name: Confirm everything is in sync
        run: npm run i18n:check --workspace server

      - name: Commit and push translations
        run: |
          git config user.name "i18n-sync-bot"
          git config user.email "actions@github.com"
          git add client/src/i18n/locales
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Auto-fill missing NL/DE translations [skip ci]"
          git push
