name: i18n sync

on:
  push:
    branches: [main]
    paths:
      - "client/src/i18n/locales/en/**"
      - "client/src/components/**"
      - "server/scripts/i18n-*.js"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: i18n-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        run: npm install --workspace server --no-audit --no-fund

      - name: Check translation structure
        run: npm run i18n:check --workspace server

      - name: Fill in missing translations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run i18n:translate --workspace server

      - name: Confirm everything is in sync
        run: npm run i18n:check --workspace server

      - name: Commit and push translations
        id: commit
        run: |
          git config user.name "i18n-sync-bot"
          git config user.email "actions@github.com"
          git add client/src/i18n/locales
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-fill missing NL/DE translations [skip ci]"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify admin review queue
        if: steps.commit.outputs.committed == 'true'
        env:
          API_URL: https://voice-nl-api-p9ey.onrender.com
          INGEST_SECRET: ${{ secrets.I18N_INGEST_SECRET }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ ! -f batch.json ]; then
            echo "No batch.json produced — nothing to notify."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const batch = JSON.parse(fs.readFileSync("batch.json", "utf8"));
            batch.commitSha = process.env.COMMIT_SHA;
            fs.writeFileSync("batch.json", JSON.stringify(batch));
          '
          curl -sf -X POST "$API_URL/api/webhooks/i18n-batch" \
            -H "Content-Type: application/json" \
            -H "x-i18n-ingest-secret: $INGEST_SECRET" \
            -d @batch.json
